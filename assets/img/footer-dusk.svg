<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMax slice" focusable="false">
  <defs>
    <linearGradient id="dusk-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061a29"/>
      <stop offset=".44" stop-color="#0a2b3d"/>
      <stop offset=".64" stop-color="#163c46"/>
      <stop offset=".78" stop-color="#573d33"/>
      <stop offset=".9" stop-color="#7b4a36"/>
      <stop offset="1" stop-color="#2b1c19"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe1ae" stop-opacity=".78"/>
      <stop offset=".35" stop-color="#ffc07d" stop-opacity=".34"/>
      <stop offset=".72" stop-color="#e9824a" stop-opacity=".1"/>
      <stop offset="1" stop-color="#d76e3e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2535"/>
      <stop offset=".58" stop-color="#061824"/>
      <stop offset="1" stop-color="#030d15"/>
    </linearGradient>
    <linearGradient id="window-warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b6"/>
      <stop offset=".48" stop-color="#ffc574"/>
      <stop offset="1" stop-color="#b95e23"/>
    </linearGradient>
    <linearGradient id="pool-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2b37"/>
      <stop offset=".55" stop-color="#061722"/>
      <stop offset="1" stop-color="#020b12"/>
    </linearGradient>
    <linearGradient id="pool-reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc471" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ffb45e" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="water-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="pool-clip">
      <path d="M540 366h520l120 54H420Z"/>
    </clipPath>
    <g id="bank-grass">
      <path d="M0 0C-2-16-8-27-15-37M3 0C2-18 5-30 10-42M7 0C11-16 18-27 27-36M-4 0C-9-11-18-18-27-23M-8 0C-14-12-22-17-31-20M9 0C15-13 24-20 34-24" fill="none" stroke="#09261f" stroke-width="1.5"/>
    </g>
    <g id="bank-bloom">
      <path d="M0 0C-1-10 2-17 0-25" fill="none" stroke="#163a2e" stroke-width="1.3"/>
      <path d="M0-10c-5-2-7-8-2-10 2 4 2 7 2 10Z" fill="#0b2a21"/>
      <circle cx="0" cy="-26" r="2.6" fill="#f4ab50"/>
      <circle cx="0" cy="-26" r="1" fill="#ffe9b7"/>
    </g>
  </defs>

  <style>
    .sun-halo {
      transform-box: fill-box;
      transform-origin: center;
      animation: sun-halo 14s ease-in-out infinite alternate;
    }

    .sun-disc {
      transform-box: fill-box;
      transform-origin: center;
      animation: sun-disc 17s ease-in-out -4s infinite alternate-reverse;
    }

    .arch {
      animation: arch-breathe 8.5s ease-in-out infinite alternate;
    }

    .arch-2 {
      animation-delay: -2.8s;
    }

    .arch-3 {
      animation-delay: -5.6s;
    }

    .reflection {
      animation: reflection-breathe 9s ease-in-out infinite alternate;
    }

    .ripples {
      transform-box: fill-box;
      transform-origin: center;
      animation: ripple-drift 11s ease-in-out infinite alternate;
    }

    .birds {
      transform-box: fill-box;
      transform-origin: center;
      animation: birds-drift 20s ease-in-out infinite alternate;
    }

    .cloud {
      animation: cloud-drift 26s ease-in-out infinite alternate;
    }

    .cloud-2 {
      animation-delay: -8s;
      animation-duration: 31s;
    }

    .cloud-3 {
      animation-delay: -15s;
      animation-duration: 23s;
    }

    .tree {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: tree-sway 16s ease-in-out infinite alternate;
    }

    .tree-right {
      animation-delay: -7s;
      animation-duration: 19s;
      animation-direction: alternate-reverse;
    }

    .mote {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: mote-rise 9s ease-in-out infinite;
      will-change: transform, opacity;
    }

    .mote-2 {
      animation-delay: -1.8s;
      animation-duration: 11s;
    }

    .mote-3 {
      animation-delay: -4.2s;
      animation-duration: 8s;
    }

    .mote-4 {
      animation-delay: -6.4s;
      animation-duration: 12s;
    }

    .mote-5 {
      animation-delay: -3.1s;
      animation-duration: 10s;
    }

    @keyframes sun-halo {
      from {
        opacity: 0.76;
        transform: scale(0.985);
      }
      to {
        opacity: 0.96;
        transform: scale(1.04);
      }
    }

    @keyframes sun-disc {
      from {
        opacity: 0.5;
        transform: scale(0.98);
      }
      to {
        opacity: 0.68;
        transform: scale(1.03);
      }
    }

    @keyframes arch-breathe {
      from {
        opacity: 0.82;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes reflection-breathe {
      from {
        opacity: 0.78;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes ripple-drift {
      from {
        opacity: 0.1;
        transform: translateX(-5px);
      }
      to {
        opacity: 0.2;
        transform: translateX(5px);
      }
    }

    @keyframes birds-drift {
      from {
        transform: translate3d(0, 0, 0);
      }
      to {
        transform: translate3d(-22px, -5px, 0);
      }
    }

    @keyframes cloud-drift {
      from {
        transform: translateX(-7px);
      }
      to {
        transform: translateX(7px);
      }
    }

    @keyframes tree-sway {
      from {
        transform: rotate(-0.6deg);
      }
      to {
        transform: rotate(0.8deg);
      }
    }

    @keyframes mote-rise {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.8);
      }
      18% {
        opacity: 0.55;
      }
      55% {
        opacity: 0.35;
      }
      82% {
        opacity: 0;
        transform: translateY(-16px) scale(1.08);
      }
      100% {
        opacity: 0;
        transform: translateY(-20px) scale(1.1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sun-halo,
      .sun-disc,
      .arch,
      .reflection,
      .ripples,
      .birds,
      .cloud,
      .tree,
      .mote {
        animation: none !important;
      }

      .mote {
        opacity: 0.34;
      }
    }
  </style>

  <rect width="1600" height="420" fill="url(#dusk-sky)"/>
